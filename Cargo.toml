[workspace]
resolver = "2"
members = [
    "rust/ulsdk",
]

[workspace.dependencies]
async-trait = "0.1.42"
arrow = "51.0.0"
base64 = "0.22"
bytes = "1.6.1"
bitflags = "1.3"
chrono = { version = "=0.4.39" }
dirs = "3.0"
ed25519-dalek = { version = "3.0.0-pre.7", features = ["zeroize"] }
flatbuffers = { version="25.2.10", features=["serialize"] }
geo-types = "0.7"
hex = "0.4"
ordered-float = { version = "4.5", features=["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["gzip", "zstd", "brotli", "rustls-tls", "blocking", "json", "multipart", "hickory-dns", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_derive = "1"
serde_ini = "0.2"
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
strum = "0.26"
strum_macros = "0.26"
tokio = { version = "1.32", features = ["full"] }
url = "2.2"
uuid = { version = "1", features=["v4", "serde"] }
