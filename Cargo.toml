# Workspace root of the public github.com/urbanlogiq/ulsdk repository.
#
# In the UrbanLogiq monorepo the crate under rust/ulsdk is a member of the
# monorepo's own Cargo workspace, and Cargo does not allow nested workspaces,
# so this file cannot be named Cargo.toml here. The sync that publishes this
# directory to GitHub renames it to Cargo.toml at the root of the public
# repository.
[workspace]
resolver = "2"
members = [
    "rust/ulsdk",
]
